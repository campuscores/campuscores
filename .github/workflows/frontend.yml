name: Frontend checks
on:
  # Full matrix runs once per release PR (develop -> main) or by manual run; deploy.yml gates every develop push.
  pull_request:
    branches: [main]
    paths: ['shared/**', 'frontend/**', 'package*.json', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage:
    strategy:
      fail-fast: false
      matrix:
        # Windows skips WebKit: Safari does not exist there. Ubuntu and macOS cover WebKit.
        # Windows also skips Firefox: users are mainly on phones and tablets, Ubuntu and macOS cover Firefox,
        # and headless Firefox on Windows runners stalls automation calls until tests time out.
        include:
          - os: ubuntu-latest
            browsers: chromium firefox webkit
            projects: ''
          - os: macos-latest
            browsers: chromium firefox webkit
            projects: ''
          - os: windows-latest
            browsers: chromium
            projects: --project=chromium --project=pixel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm test -- ${{ matrix.projects }}
