name: Frontend checks

on:
  push:
    paths: ['frontend/**', 'package*.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'package*.json', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  homepage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
