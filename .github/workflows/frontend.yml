name: Frontend checks
on:
  push:
    paths: ['frontend/**', 'package*.json', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'package*.json', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  homepage:
    strategy:
      fail-fast: false
      matrix:
        # Windows skips WebKit: Safari does not exist there. Ubuntu and macOS cover WebKit.
        include:
          - os: ubuntu-latest
            browsers: chromium firefox webkit
            projects: ''
          - os: macos-latest
            browsers: chromium firefox webkit
            projects: ''
          - os: windows-latest
            browsers: chromium firefox
            projects: --project=chromium --project=firefox --project=pixel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm test -- ${{ matrix.projects }}
