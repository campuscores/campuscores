name: Deploy
on:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop -> staging, main -> production. Secrets and vars come from the GitHub Environment.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging' }}
      # Never stop a deploy mid-migration; a newer push waits for the running one.
      cancel-in-progress: false
    services:
      postgres:
        # Same throwaway test database as backend.yml; it never holds environment data.
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tlympics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d tlympics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/tlympics_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci

      # Tests first: any failure stops the run before the database or Worker changes.
      - run: npm run lint
      - run: npm run lint:backend
      - run: npx dbmate --url "$TEST_DATABASE_URL" --migrations-dir db/migrations --no-dump-schema --wait up
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/fake.sql
      - run: npm run test:backend
        env:
          REQUIRE_DB: '1'
      # Full browser matrix runs in frontend.yml; the deploy gate uses the Chromium projects.
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --project=chromium --project=pixel

      # Migrate before deploy, so a failed migration never ships a Worker (Neon direct URL).
      - run: npx dbmate --url "$DATABASE_URL" --migrations-dir db/migrations --no-dump-schema up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Off by default: staging now holds hand-made demo data that a deploy must not change.
      # Set the repository variable SEED_STAGING to 'true' to apply the fake seed again.
      - if: env.DEPLOY_ENV == 'staging' && vars.SEED_STAGING == 'true'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/fake.sql
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Rebuild with the environment's public VITE_* values; Vite sends them to the browser.
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      - run: npx wrangler deploy --env "$DEPLOY_ENV"
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Smoke_Script against the environment origin (staging workers.dev URL or the production domain).
      - run: node backend/scripts/smoke.js "$BASE_URL"
        env:
          BASE_URL: ${{ vars.VITE_API_BASE }}
